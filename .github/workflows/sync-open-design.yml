name: Sync Selected Folders from nexu-io/open-design

on:
  schedule:
    - cron: "0 0 * * *" # Auto run 00:00 UTC every day
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Sparse Checkout and Copy folders from Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone required folders from source repo (Sparse Checkout)
          git clone --depth 1 --filter=blob:none --sparse https://github.com/nexu-io/open-design.git temp_upstream
          cd temp_upstream
          git sparse-checkout set craft design-systems design-templates packages/contracts/src/design-systems prompt-templates skills
          cd ..

          # Create destination folders if not exists
          mkdir -p craft design-systems design-templates packages/contracts/src/design-systems prompt-templates skills

          # Sync data to current repo
          rsync -av --delete temp_upstream/craft/ ./craft/
          rsync -av --delete temp_upstream/design-systems/ ./design-systems/
          rsync -av --delete temp_upstream/design-templates/ ./design-templates/
          rsync -av --delete temp_upstream/packages/contracts/src/design-systems/ ./packages/contracts/src/design-systems/
          rsync -av --delete temp_upstream/prompt-templates/ ./prompt-templates/
          rsync -av --delete temp_upstream/skills/ ./skills/

          rm -rf temp_upstream

      - name: Commit and Push changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes from nexu-io/open-design"
          else
            git commit -m "Auto sync selected folders from nexu-io/open-design"
            git push
          fi
